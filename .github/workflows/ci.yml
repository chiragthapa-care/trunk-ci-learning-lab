name: CI Basics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check README exists
        run: |
          test -f README.md
          echo "README check passed"

  app-tests:
    name: Application tests
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run API integration tests
        run: npm test

  package-artifact:
    name: Package release artifact
    needs: [readme-check, app-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Package application
        run: npm run package

      - name: Verfify release package
        run: |
          tar -tzf dist/app-release.tar.gz
          sha256sum dist/app-release.tar.gz
          echo "Release package verification passed"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/app-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  verify-release:
    name: Verify downloaded release
    needs: package-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: downloaded
          digest-mismatch: error

      - name: Verify downloaded release
        env:
          EXPECTED_SHA256: ${{ needs.package-artifact.outputs.release_sha256 }}
        run: |
          set -euo pipefail
          # Verify the downloaded ZIP exists.
          test -f downloaded/app-release.zip

          # Print SHA-256 of the outer ZIP.
          echo "SHA-256 of app-release.zip:"
          sha256sum downloaded/app-release.zip

          # Show files inside the ZIP.
          unzip -l downloaded/app-release.zip

          # Extract the ZIP.
          mkdir -p downloaded/extracted
          unzip -q downloaded/app-release.zip -d downloaded/extracted

          # Verify the inner release archive exists.
          test -f downloaded/extracted/app-release.tar.gz

          # Check the original release-file checksum.
          printf '%s  %s\n' \
            "$EXPECTED_SHA256" \
            "downloaded/extracted/app-release.tar.gz" \
            | sha256sum -c -

          # Inspect the release package contents.
          tar -tzf downloaded/extracted/app-release.tar.gz

          echo "Downloaded release verification passed"