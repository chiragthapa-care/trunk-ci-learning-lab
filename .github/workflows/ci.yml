name: CI Basics

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readme-check:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check README exists
        run: |
          test -f README.md
          echo "README check passed"

  app-tests:
    name: Application tests
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run API integration tests
        run: npm test

  package-artifact:
    name: Package release artifact
    needs: [readme-check, app-tests]
    runs-on: ubuntu-latest

    outputs:
      release_sha256: ${{ steps.checksum.outputs.release_sha256 }}

    steps:
      - name: Get repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Package application
        run: npm run package

      - name: Verify release package and calculate SHA-256
        id: checksum
        run: |
          set -euo pipefail
          test -f dist/app-release.tar.gz
          tar -tzf dist/app-release.tar.gz

          SHA256=$(sha256sum dist/app-release.tar.gz | awk '{print $1}')
          echo "Original release SHA-256: $SHA256"
          echo "release_sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Release package verification passed"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: dist/app-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  verify-release:
    name: Verify downloaded release
    needs: package-artifact
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: downloaded
          skip-decompress: true
          digest-mismatch: error

      - name: Verify downloaded release
        env:
          EXPECTED_SHA256: ${{ needs.package-artifact.outputs.release_sha256 }}
        run: |
          set -euo pipefail

          # Inspect downloaded files and verify the expected checksum is present.
          echo "Downloaded files:"
          ls -lah downloaded/
          test -n "$EXPECTED_SHA256"

          # Verify the downloaded ZIP exists.
          test -f downloaded/app-release.zip

          # Print SHA-256 of the outer ZIP.
          echo "SHA-256 of app-release.zip:"
          sha256sum downloaded/app-release.zip

          # Show files inside the ZIP.
          unzip -l downloaded/app-release.zip

          # Extract the ZIP.
          mkdir -p downloaded/extracted
          unzip -q downloaded/app-release.zip -d downloaded/extracted

          # Verify the inner release archive exists.
          test -f downloaded/extracted/app-release.tar.gz

          # Check the original release-file checksum.
          printf '%s  %s\n' \
            "$EXPECTED_SHA256" \
            "downloaded/extracted/app-release.tar.gz" \
            | sha256sum -c -

          # Inspect the release package contents.
          tar -tzf downloaded/extracted/app-release.tar.gz

          echo "Downloaded release verification passed"

  
  simulate-dev:
    name: Simulated development smoke test
    needs: [package-artifact, verify-release]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: downloaded
          skip-decompress: false
          digest-mismatch: error

      - name: Verify and extract release
        env:
          EXPECTED_SHA256: ${{ needs.package-artifact.outputs.release_sha256 }}
        run: |
          set -euo pipefail

          test -f downloaded/app-release.tar.gz
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]

          printf '%s  %s\n' \
            "$EXPECTED_SHA256" \
            "downloaded/app-release.tar.gz" \
            | sha256sum -c -

          mkdir -p dev-app
          tar -xzf downloaded/app-release.tar.gz -C dev-app

          test -f dev-app/package.json
          test -f dev-app/src/app.js
          test -f dev-app/src/server.js

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Start application and run smoke tests
        shell: bash
        run: |
          set -euo pipefail

          PORT=43127 node dev-app/src/server.js \
            > "$RUNNER_TEMP/dev-server.log" 2>&1 &

          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:43127/health \
                > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/dev-server.log"
            exit 1
          fi

          curl -fsS http://127.0.0.1:43127/health \
            | grep -Fq '"status":"ok"'

          curl -fsS \
            'http://127.0.0.1:43127/greet?name=Alex' \
            | grep -Fq '"message":"Hello, Alex!"'

          echo "Development smoke tests passed."
  

  simulate-staging:
    name: Simulated staging acceptance test
    needs: [package-artifact, simulate-dev]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: downloaded
          skip-decompress: false
          digest-mismatch: error

      - name: Verify and extract staging release
        env:
          EXPECTED_SHA256: ${{ needs.package-artifact.outputs.release_sha256 }}
        run: |
          set -euo pipefail

          test -f downloaded/app-release.tar.gz
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]

          printf '%s  %s\n' \
            "$EXPECTED_SHA256" \
            "downloaded/app-release.tar.gz" \
            | sha256sum -c -

          mkdir -p staging-app
          tar -xzf downloaded/app-release.tar.gz -C staging-app

          test -f staging-app/package.json
          test -f staging-app/src/app.js
          test -f staging-app/src/server.js

          echo "Staging artifact verified and extracted."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Start application and run staging tests
        shell: bash
        run: |
          set -euo pipefail

          PORT=43128 node staging-app/src/server.js \
            > "$RUNNER_TEMP/staging-server.log" 2>&1 &

          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:43128/health \
                > /dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/staging-server.log"
            exit 1
          fi

          # Validate successful responses.
          curl -fsS http://127.0.0.1:43128/health \
            | grep -Fq '"status":"ok"'

          curl -fsS \
            'http://127.0.0.1:43128/greet?name=Alex' \
            | grep -Fq '"message":"Hello, Alex!"'

          # Validate HTTP error responses.
          check_status() {
            expected="$1"
            shift

            actual="$(curl -sS -o /dev/null \
              -w '%{http_code}' "$@")"

            echo "Expected HTTP $expected, received HTTP $actual"
            test "$actual" = "$expected"
          }

          check_status 400 \
            'http://127.0.0.1:43128/greet'

          check_status 404 \
            'http://127.0.0.1:43128/unknown'

          check_status 405 -X POST \
            'http://127.0.0.1:43128/health'

          echo "Staging acceptance tests passed."
          exit 1

  simulate-production:
    name: Simulated production readiness check
    needs: [package-artifact, simulate-staging]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: app-release
          path: downloaded
          skip-decompress: false
          digest-mismatch: error

      - name: Verify and extract production release
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package-artifact.outputs.release_sha256 }}
        run: |
          set -euo pipefail

          test -f downloaded/app-release.tar.gz
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]

          printf '%s  %s\n' \
            "$EXPECTED_SHA256" \
            "downloaded/app-release.tar.gz" \
            | sha256sum -c -

          mkdir -p production-app

          tar -xzf downloaded/app-release.tar.gz \
            -C production-app

          test -f production-app/package.json
          test -f production-app/src/app.js
          test -f production-app/src/server.js

          echo "Production release integrity verified."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run production readiness smoke tests
        shell: bash
        run: |
          set -euo pipefail

          PORT=43129 node production-app/src/server.js \
            > "$RUNNER_TEMP/production-server.log" 2>&1 &

          server_pid=$!

          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0

          for attempt in {1..20}; do
            if curl -fsS \
              http://127.0.0.1:43129/health \
              > /dev/null 2>&1; then
              ready=1
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/production-server.log"
            exit 1
          fi

          curl -fsS \
            http://127.0.0.1:43129/health \
            | grep -Fq '"status":"ok"'

          curl -fsS \
            'http://127.0.0.1:43129/greet?name=Alex' \
            | grep -Fq '"message":"Hello, Alex!"'

          echo "Production readiness smoke tests passed."
          echo "Simulated promotion completed."
